name: Merge me!

# After CI on the PR succeeds, approve and merge Dependabot PRs. Uses
# workflow_run so checks stay on pull_request (see merge-me-action README).
on:
  workflow_run:
    workflows:
      - Code Quality
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-me:
    name: Merge me!
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Merge me!
        uses: ridedott/merge-me-action@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: 'dependabot[bot]'
          ENABLE_GITHUB_API_PREVIEW: true
