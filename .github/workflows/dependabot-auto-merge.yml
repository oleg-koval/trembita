name: Auto merge Dependabot updates

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    # Scope by PR author only: when github.actor is dependabot[bot], GITHUB_TOKEN
    # is read-only for pull_request_target; maintainer-triggered runs (labels,
    # etc.) keep write permissions while the PR remains Dependabot-authored.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: auto-merge
        uses: ridedott/dependabot-auto-merge-action@v2.10.158
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
