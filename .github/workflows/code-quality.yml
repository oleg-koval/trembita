name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npm audit
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - name: OpenAPI fixture types match committed output
        run: |
          npm run gen:fixtures --workspace=@trembita/openapi
          git diff --exit-code packages/openapi/fixtures/mini-api.paths.ts
      - name: Check openapi-fetch upstream FetchResponse contract
        run: npm run check:openapi-fetch-types

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npm audit
      - run: npm run build
      - run: npm test
      - name: Dogfood OpenAPI example (file-linked workspace packages)
        run: npm run verify:openapi-dogfood
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
          fail-on-error: false
