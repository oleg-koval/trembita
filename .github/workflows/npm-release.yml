name: Release to NPM

# npm Trusted Publishing (OIDC):
# https://gist.github.com/kettanaito/debde3cabfae4f68d37cf0f8f3a6a666
# - Node 24+ is required for Trusted Publishing on the npm side.
# - This repo publishes TWO packages: `trembita` and `@trembita/openapi`.
# - Each package must have its own Trusted Publisher on npmjs.com for this workflow.
# - OIDC-only publishing is intentional. Do not pass NPM_TOKEN here: token fallback
#   can fail with EOTP when 2FA is enabled.

on:
  push:
    branches:
      - main
      - beta

jobs:
  release:
    name: Release to NPM and GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npm audit
      - run: npm run build
      - run: npm test
      # Trusted publishing + provenance need npm CLI >= 11.5.1 (see npm trusted-publishers docs).
      - env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release
